name: Build operator skill packages

# Build review artifacts only. Release publication requires separate approval.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skills.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_skills.py --output dist/skills
      - run: python scripts/package_plugin.py --output dist/plugin
      - uses: actions/upload-artifact@v4
        with:
          name: operator-skills-${{ github.sha }}
          path: |
            dist/skills/*.zip
            dist/plugin/*.zip
          if-no-files-found: error
